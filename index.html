<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML rel="me" Checker</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-alt: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-disabled: #1e3a8a;
      --code-bg: #0f172a;
      --success-bg: rgba(22, 163, 74, 0.14);
      --success-border: rgba(34, 197, 94, 0.35);
      --success-text: #4ade80;
      --warn-bg: rgba(234, 179, 8, 0.14);
      --warn-border: rgba(250, 204, 21, 0.35);
      --warn-text: #facc15;
      --error-bg: rgba(220, 38, 38, 0.14);
      --error-border: rgba(248, 113, 113, 0.35);
      --error-text: #f87171;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-alt: #f8fafc;
        --border: #cbd5e1;
        --text: #0f172a;
        --text-muted: #475569;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --accent-disabled: #93c5fd;
        --code-bg: #e2e8f0;
        --success-bg: #f0fdf4;
        --success-border: #86efac;
        --success-text: #15803d;
        --warn-bg: #fefce8;
        --warn-border: #fde047;
        --warn-text: #a16207;
        --error-bg: #fef2f2;
        --error-border: #fca5a5;
        --error-text: #b91c1c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 760px;
      margin: 48px auto;
      padding: 0 16px;
      line-height: 1.55;
      color: var(--text);
      background: var(--bg);
    }

    .card {
      background: var(--surface);
      padding: 28px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--text-muted);
      font-size: 0.96rem;
    }

    code {
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.88em;
      border: 1px solid var(--border);
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--surface-alt);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .captcha-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 2px;
    }

    .captcha-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .captcha-img {
      display: block;
      width: 156px;
      height: 42px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    button.icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 0;
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.15rem;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    button.icon-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
    }

    button.icon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input.captcha-input {
      flex: 0 1 130px;
      min-width: 100px;
      padding: 9px 12px;
      font-size: 0.98rem;
      background: var(--surface);
    }

    button.primary {
      padding: 11px 20px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button.primary:disabled {
      background: var(--accent-disabled);
      cursor: not-allowed;
      opacity: 0.8;
    }

    button.secondary {
      padding: 11px 14px;
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.94rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    button.secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text);
    }

    button.secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
    }

    #status.visible {
      display: block;
    }

    #status.loading {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    #status.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }

    #status.warn {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
    }

    #status.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    #meta {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    ul#results {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    li.result-item {
      background: var(--surface-alt);
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      word-break: break-all;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .badges {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      background: var(--surface);
    }

    .pill.warn {
      color: var(--warn-text);
      background: var(--warn-bg);
      border-color: var(--warn-border);
    }

    button.copy-btn {
      padding: 4px 10px;
      font-size: 0.82rem;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    button.copy-btn:hover {
      border-color: var(--accent);
    }

    .result-row {
      margin-top: 4px;
      font-size: 0.94rem;
    }

    .result-row strong {
      color: var(--text-muted);
      font-weight: 600;
    }

    a.result-link {
      color: var(--accent);
      text-decoration: none;
    }

    a.result-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .card {
        padding: 20px;
      }
      .input-group {
        flex-direction: column;
      }
      button.primary,
      button.secondary {
        width: 100%;
      }
      input.captcha-input {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <h1>HTML <code>rel="me"</code> Checker</h1>
    <p class="subtitle">
      Inspect any webpage for <code>&lt;a&gt;</code> and <code>&lt;link&gt;</code> elements containing <code>rel="me"</code>.
    </p>

    <form id="checkForm" class="form-stack" novalidate>
      <div class="input-group">
        <input
          type="text"
          id="urlInput"
          inputmode="url"
          autocomplete="url"
          placeholder="https://example.com"
          aria-label="Website URL"
          required
        >
        <button type="submit" id="checkBtn" class="primary">Check URL</button>
        <button type="button" id="clearBtn" class="secondary">Clear</button>
      </div>

      <div class="hp-field" aria-hidden="true">
        <label for="hpField">Leave this field empty</label>
        <input type="text" id="hpField" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="captcha-row">
        <span class="captcha-label">Anti-bot check:</span>
        <div class="captcha-box">
          <img
            id="captchaImg"
            class="captcha-img"
            alt="Anti-bot math challenge"
            width="156"
            height="42"
          >
          <button
            type="button"
            id="refreshCaptchaBtn"
            class="icon-btn"
            aria-label="Refresh anti-bot challenge"
            title="New challenge"
          >&#8635;</button>
        </div>
        <input
          type="text"
          id="captchaInput"
          class="captcha-input"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          placeholder="Answer"
          aria-label="Anti-bot math answer"
          required
        >
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="meta"></div>
    <ul id="results"></ul>
  </main>

  <script>
    const form = document.getElementById('checkForm');
    const urlInput = document.getElementById('urlInput');
    const hpField = document.getElementById('hpField');
    const captchaImg = document.getElementById('captchaImg');
    const captchaInput = document.getElementById('captchaInput');
    const refreshCaptchaBtn = document.getElementById('refreshCaptchaBtn');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const resultsEl = document.getElementById('results');
    const checkBtn = document.getElementById('checkBtn');
    const clearBtn = document.getElementById('clearBtn');

    let currentCaptchaToken = '';

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = `visible ${type}`;
    }

    function clearOutput() {
      statusEl.textContent = '';
      statusEl.className = '';
      metaEl.textContent = '';
      resultsEl.innerHTML = '';
    }

    async function loadCaptcha() {
      refreshCaptchaBtn.disabled = true;
      try {
        const res = await fetch('/api/challenge', { cache: 'no-store' });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || 'Failed to load anti-bot challenge.');
        }
        currentCaptchaToken = data.token;
        captchaImg.src = data.image;
        captchaInput.value = '';
      } catch (err) {
        currentCaptchaToken = '';
        setStatus(`Anti-bot error: ${err.message}`, 'error');
      } finally {
        refreshCaptchaBtn.disabled = false;
      }
    }

    function normaliseInputUrl(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) {
        return trimmed;
      }
      if (/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(trimmed)) {
        return trimmed;
      }
      return `https://${trimmed}`;
    }

    function getEffectiveBaseUrl(doc, fallbackUrl) {
      const baseEl = doc.querySelector('base[href]');
      if (!baseEl) return fallbackUrl;
      const rawBase = (baseEl.getAttribute('href') || '').trim();
      if (!rawBase) return fallbackUrl;
      try {
        return new URL(rawBase, fallbackUrl).href;
      } catch {
        return fallbackUrl;
      }
    }

    function resolveHref(rawHref, baseUrl) {
      if (!rawHref) {
        return { displayHref: '(no href)', resolvedUrl: null, isHttp: false, protocol: '' };
      }
      try {
        const parsed = new URL(rawHref, baseUrl);
        const isHttp = parsed.protocol === 'http:' || parsed.protocol === 'https:';
        return {
          displayHref: rawHref,
          resolvedUrl: parsed.href,
          isHttp,
          protocol: parsed.protocol
        };
      } catch {
        return { displayHref: rawHref, resolvedUrl: null, isHttp: false, protocol: '' };
      }
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      document.body.removeChild(textarea);
      if (!copied) {
        throw new Error('Copy command failed');
      }
    }

    function renderMatchItem(item) {
      const li = document.createElement('li');
      li.className = 'result-item';

      const header = document.createElement('div');
      header.className = 'result-header';

      const badges = document.createElement('div');
      badges.className = 'badges';

      const tagCode = document.createElement('code');
      tagCode.textContent = `<${item.tag}>`;

      const relCode = document.createElement('code');
      relCode.textContent = `rel="${item.rel}"`;

      badges.appendChild(tagCode);
      badges.appendChild(relCode);

      if (item.protocol === 'http:') {
        const httpPill = document.createElement('span');
        httpPill.className = 'pill warn';
        httpPill.textContent = 'HTTP (non-HTTPS)';
        badges.appendChild(httpPill);
      }

      if (item.isDuplicate) {
        const dupPill = document.createElement('span');
        dupPill.className = 'pill';
        dupPill.textContent = 'Duplicate URL';
        badges.appendChild(dupPill);
      }

      header.appendChild(badges);

      if (item.resolvedUrl) {
        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy URL';
        copyBtn.addEventListener('click', async () => {
          try {
            await copyText(item.resolvedUrl);
            copyBtn.textContent = 'Copied!';
            setTimeout(() => {
              copyBtn.textContent = 'Copy URL';
            }, 1500);
          } catch {
            copyBtn.textContent = 'Copy failed';
          }
        });
        header.appendChild(copyBtn);
      }

      li.appendChild(header);

      const urlRow = document.createElement('div');
      urlRow.className = 'result-row';
      const urlLabel = document.createElement('strong');
      urlLabel.textContent = 'URL: ';
      urlRow.appendChild(urlLabel);

      if (item.isHttp && item.resolvedUrl) {
        const anchor = document.createElement('a');
        anchor.className = 'result-link';
        anchor.href = item.resolvedUrl;
        anchor.target = '_blank';
        anchor.rel = 'noopener noreferrer';
        anchor.textContent = item.resolvedUrl;
        urlRow.appendChild(anchor);
      } else {
        const plain = document.createElement('span');
        plain.textContent = item.resolvedUrl || item.displayHref;
        urlRow.appendChild(plain);
      }

      li.appendChild(urlRow);

      if (item.resolvedUrl && item.displayHref !== item.resolvedUrl) {
        const rawRow = document.createElement('div');
        rawRow.className = 'result-row';
        const rawLabel = document.createElement('strong');
        rawLabel.textContent = 'Raw href: ';
        const rawCode = document.createElement('code');
        rawCode.textContent = item.displayHref;
        rawRow.appendChild(rawLabel);
        rawRow.appendChild(rawCode);
        li.appendChild(rawRow);
      }

      if (item.text) {
        const textRow = document.createElement('div');
        textRow.className = 'result-row';
        const textLabel = document.createElement('strong');
        textLabel.textContent = 'Link Text: ';
        const textSpan = document.createElement('span');
        textSpan.textContent = item.text;
        textRow.appendChild(textLabel);
        textRow.appendChild(textSpan);
        li.appendChild(textRow);
      }

      if (item.title) {
        const titleRow = document.createElement('div');
        titleRow.className = 'result-row';
        const titleLabel = document.createElement('strong');
        titleLabel.textContent = 'Title Attribute: ';
        const titleSpan = document.createElement('span');
        titleSpan.textContent = item.title;
        titleRow.appendChild(titleLabel);
        titleRow.appendChild(titleSpan);
        li.appendChild(titleRow);
      }

      if (item.type) {
        const typeRow = document.createElement('div');
        typeRow.className = 'result-row';
        const typeLabel = document.createElement('strong');
        typeLabel.textContent = 'Type Attribute: ';
        const typeCode = document.createElement('code');
        typeCode.textContent = item.type;
        typeRow.appendChild(typeLabel);
        typeRow.appendChild(typeCode);
        li.appendChild(typeRow);
      }

      return li;
    }

    async function checkRelMe(event) {
      if (event) event.preventDefault();

      const targetUrl = normaliseInputUrl(urlInput.value);
      const captchaAnswer = captchaInput.value.trim();
      clearOutput();

      if (!targetUrl) {
        setStatus('Please enter a valid URL.', 'error');
        urlInput.focus();
        return;
      }

      if (!currentCaptchaToken) {
        setStatus('Loading anti-bot challenge...', 'loading');
        await loadCaptcha();
        captchaInput.focus();
        return;
      }

      if (!captchaAnswer) {
        setStatus('Please solve the anti-bot math check before submitting.', 'error');
        captchaInput.focus();
        return;
      }

      urlInput.value = targetUrl;
      checkBtn.disabled = true;
      clearBtn.disabled = true;
      refreshCaptchaBtn.disabled = true;
      setStatus('Fetching webpage...', 'loading');

      try {
        const params = new URLSearchParams({
          url: targetUrl,
          captchaToken: currentCaptchaToken,
          captchaAnswer,
          hp: hpField.value
        });

        const response = await fetch(`/api/check?${params.toString()}`);
        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || `Server returned HTTP ${response.status}`);
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(data.html, 'text/html');
        const effectiveBaseUrl = getEffectiveBaseUrl(doc, data.finalUrl || targetUrl);

        metaEl.textContent = `Inspected: ${data.finalUrl || targetUrl} (HTTP ${data.status})`;

        const candidates = doc.querySelectorAll('a[rel], link[rel]');
        const matches = [];
        const seenUrls = new Set();

        candidates.forEach(el => {
          const rawRel = el.getAttribute('rel') || '';
          const relTokens = rawRel.toLowerCase().trim().split(/\s+/);
          if (relTokens.includes('me')) {
            const rawHref = (el.getAttribute('href') || '').trim();
            const resolved = resolveHref(rawHref, effectiveBaseUrl);
            const dedupeKey = resolved.resolvedUrl || resolved.displayHref;
            const isDuplicate = seenUrls.has(dedupeKey);
            seenUrls.add(dedupeKey);

            matches.push({
              tag: el.tagName.toLowerCase(),
              rel: rawRel.trim(),
              text: el.textContent.replace(/\s+/g, ' ').trim(),
              title: (el.getAttribute('title') || '').trim(),
              type: (el.getAttribute('type') || '').trim(),
              isDuplicate,
              ...resolved
            });
          }
        });

        if (matches.length === 0) {
          setStatus(`Page loaded (HTTP ${data.status}), but no rel="me" links were found.`, 'warn');
        } else {
          setStatus(`Found ${matches.length} rel="me" link(s).`, 'success');
          matches.forEach(item => {
            resultsEl.appendChild(renderMatchItem(item));
          });
        }
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      } finally {
        checkBtn.disabled = false;
        clearBtn.disabled = false;
        await loadCaptcha();
      }
    }

    form.addEventListener('submit', checkRelMe);
    refreshCaptchaBtn.addEventListener('click', () => {
      loadCaptcha();
      captchaInput.focus();
    });
    clearBtn.addEventListener('click', () => {
      urlInput.value = '';
      clearOutput();
      loadCaptcha();
      urlInput.focus();
    });

    loadCaptcha();
  </script>

</body>
</html>
